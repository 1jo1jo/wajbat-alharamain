<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حسابي | وجبة الحرمين</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="account" data-nav="1">
<div id="app">
<section class="view gray" id="v-account">
  <div class="bar"><button onclick="back()"><svg class="i "><use href="#arrow-l"/></svg></button><h2>حسابي<small>إدارة حسابك وطلباتك</small></h2><span style="width:32px"></span></div>
  <div class="card hello" style="margin:16px 12px 0"><div class="av"><svg class="i "><use href="#user-f"/></svg></div><div><b>مرحباً بك</b><small>سجل دخولك للاستفادة من خدماتنا</small></div><button onclick="go('login')">تسجيل الدخول</button></div>
  <div class="two"><div onclick="go('orders')"><b>طلباتي</b><small>قائمة الطلبات</small></div><div onclick="toast('قائمة الرغبات فارغة')"><b>قائمة رغباتي</b><small>المنتجات المفضلة</small></div></div>
  <div class="list"><button class="it" onclick="toast('لا توجد عناوين محفوظة')"><i><svg class="i "><use href="#pin"/></svg></i><b>العناوين</b><span class="chev"><svg class="i "><use href="#chev-r"/></svg></span></button><button class="it" onclick="go('cards')"><i><svg class="i "><use href="#card-f"/></svg></i><b>إدارة البطاقات</b><span class="chev"><svg class="i "><use href="#chev-r"/></svg></span></button></div>
  <div class="list"><button class="it" onclick="sheet('country')"><i><svg class="i "><use href="#globe"/></svg></i><b>البلد</b><span class="tag" id="ctag">السعودية 🇸🇦</span><span class="chev"><svg class="i "><use href="#chev-r"/></svg></span></button></div>
  <div class="list"><button class="it" onclick="go('notif')"><i><svg class="i "><use href="#bell"/></svg></i><b>الإشعارات</b><span class="chev"><svg class="i "><use href="#chev-r"/></svg></span></button></div>
  <div class="social"><span><svg class="i "><use href="#fb"/></svg></span><span>X</span><span><svg class="i "><use href="#case"/></svg></span><span><svg class="i "><use href="#camera"/></svg></span></div>
  <p class="copy">© 2026 وجبة الحرمين - جميع الحقوق محفوظة</p>
</section>
</div>
<script src="js/script.js"></script>
</body>
</html>
