<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>لوحة المطعم | وجبة الحرمين</title>

    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            font-family: 'IBM Plex Sans Arabic', sans-serif;
            background: #f7f8f7;
        }

        .restaurant-page {
            max-width: 1250px;
            margin: auto;
            padding: 30px 20px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 30px;
        }

        .page-header h1 {
            color: #0c4d3a;
            margin: 0 0 5px;
        }

        .page-header p {
            color: #777;
            margin: 0;
        }

        .btn {
            border: none;
            border-radius: 10px;
            padding: 11px 20px;
            font-family: inherit;
            cursor: pointer;
            font-size: 14px;
            transition: .2s;
        }

        .btn-green {
            background: #0c4d3a;
            color: white;
        }

        .btn-green:hover {
            background: #083b2d;
        }

        .btn-gold {
            background: #c4963a;
            color: white;
        }

        .btn-light {
            background: #f1f3f1;
            color: #333;
        }

        .btn-danger {
            background: #fce8e8;
            color: #b42318;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            margin-bottom: 25px;
        }

        .stat-card,
        .section-card {
            background: white;
            border: 1px solid #eee;
            border-radius: 16px;
            padding: 22px;
            box-shadow: 0 3px 12px rgba(0,0,0,.035);
        }

        .stat-card h3 {
            color: #777;
            font-size: 15px;
            font-weight: 500;
            margin: 0 0 10px;
        }

        .stat-card strong {
            color: #0c4d3a;
            font-size: 29px;
        }

        .section-card {
            margin-bottom: 25px;
        }

        .section-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
        }

        .section-heading h2 {
            color: #0c4d3a;
            margin: 0;
            font-size: 21px;
        }

        .meal-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 18px;
        }

        .meal-card {
            border: 1px solid #eee;
            border-radius: 14px;
            overflow: hidden;
            background: white;
        }

        .meal-card img {
            width: 100%;
            height: 165px;
            object-fit: cover;
            background: #f1f1f1;
        }

        .meal-info {
            padding: 15px;
        }

        .meal-info h3 {
            color: #0c4d3a;
            margin: 0 0 7px;
        }

        .meal-info p {
            color: #777;
            font-size: 13px;
            margin: 5px 0;
        }

        .meal-price {
            color: #c4963a;
            font-weight: bold;
            font-size: 17px;
            margin: 12px 0;
        }

        .meal-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .meal-actions button {
            flex: 1;
            padding: 8px;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 650px;
        }

        th, td {
            padding: 14px;
            text-align: right;
            border-bottom: 1px solid #eee;
        }

        th {
            color: #0c4d3a;
            background: #f8faf9;
        }

        .status {
            display: inline-block;
            padding: 5px 11px;
            border-radius: 20px;
            font-size: 12px;
            background: #f1f1f1;
        }

        .status-confirmed {
            background: #e4f3e9;
            color: #187443;
        }

        .status-preparing {
            background: #fff2d8;
            color: #966500;
        }

        .status-ready {
            background: #e4efff;
            color: #2456a6;
        }

        .empty-message,
        .loading {
            text-align: center;
            padding: 30px;
            color: #888;
        }

        /* نافذة إضافة وتعديل الوجبة */

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.5);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: white;
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            border-radius: 18px;
            padding: 25px;
        }

        .modal-content h2 {
            color: #0c4d3a;
            margin-top: 0;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
            color: #444;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 9px;
            font-family: inherit;
            font-size: 14px;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 85px;
        }

        .form-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .form-buttons button {
            flex: 1;
        }

        #imagePreview {
            width: 100%;
            max-height: 170px;
            object-fit: contain;
            display: none;
            margin-top: 10px;
            border-radius: 10px;
        }

        @media(max-width: 650px) {
            .stats {
                grid-template-columns: 1fr;
            }

            .restaurant-page {
                padding: 20px 12px;
            }

            .section-card {
                padding: 16px;
            }
        }
    </style>
</head>

<body data-page="restaurant" data-nav="0">

<div id="app">

    <main class="restaurant-page">

        <header class="page-header">
            <div>
                <h1>لوحة المطعم</h1>
                <p>مرحباً بك في لوحة إدارة مطعمك</p>
            </div>

            <button class="btn btn-danger" onclick="logout()">
                تسجيل الخروج
            </button>
        </header>

        <!-- الإحصائيات -->

        <section class="stats">

            <div class="stat-card">
                <h3>إجمالي الوجبات</h3>
                <strong id="totalMeals">0</strong>
            </div>

            <div class="stat-card">
                <h3>الطلبات الجديدة</h3>
                <strong id="newOrders">0</strong>
            </div>

            <div class="stat-card">
                <h3>الطلبات الجاهزة</h3>
                <strong id="readyOrders">0</strong>
            </div>

        </section>

        <!-- إدارة الوجبات -->

        <section class="section-card">

            <div class="section-heading">
                <h2>إدارة الوجبات</h2>

                <button class="btn btn-green" onclick="openMealForm()">
                    + إضافة وجبة جديدة
                </button>
            </div>

            <div id="mealList" class="meal-grid">
                <p class="loading">جاري تحميل الوجبات...</p>
            </div>

        </section>

        <!-- الطلبات -->

        <section class="section-card">

            <div class="section-heading">
                <h2>طلبات العملاء</h2>

                <button class="btn btn-light" onclick="loadOrders()">
                    تحديث الطلبات
                </button>
            </div>

            <div class="table-wrapper">

                <table>
                    <thead>
                    <tr>
                        <th>رقم الطلب</th>
                        <th>رقم العميل</th>
                        <th>تاريخ الطلب</th>
                        <th>الحالة</th>
                        <th>الإجراء</th>
                    </tr>
                    </thead>

                    <tbody id="ordersList">
                    <tr>
                        <td colspan="5" class="loading">
                            جاري تحميل الطلبات...
                        </td>
                    </tr>
                    </tbody>
                </table>

            </div>

        </section>

    </main>

</div>


<!-- نافذة الوجبة -->

<div class="modal" id="mealModal">

    <div class="modal-content">

        <h2 id="modalTitle">إضافة وجبة جديدة</h2>

        <form id="mealForm">

            <input type="hidden" id="mealId">

            <div class="form-group">
                <label for="mealName">اسم الوجبة</label>
                <input type="text" id="mealName" required>
            </div>

            <div class="form-group">
                <label for="mealDescription">وصف الوجبة</label>
                <textarea id="mealDescription" required></textarea>
            </div>

            <div class="form-group">
                <label for="mealPrice">السعر بالريال</label>
                <input type="number" id="mealPrice" min="0.01" step="0.01" required>
            </div>

            <div class="form-group">
                <label for="mealQuantity">الكمية المتوفرة</label>
                <input type="number" id="mealQuantity" min="0" required>
            </div>

            <div class="form-group">
                <label for="mealImage">صورة الوجبة</label>
                <input type="file" id="mealImage" accept="image/jpeg,image/png,image/webp">
                <img id="imagePreview" alt="معاينة الصورة">
                <small id="imageNote" style="color:#888">
                    اختاري صورة بصيغة JPG أو PNG أو WEBP، بحد أقصى 5MB.
                </small>
            </div>

            <div class="form-buttons">
                <button type="submit" class="btn btn-green" id="saveMealBtn">
                    حفظ الوجبة
                </button>

                <button type="button" class="btn btn-light" onclick="closeMealForm()">
                    إلغاء
                </button>
            </div>

        </form>

    </div>

</div>


<script src="js/script.js"></script>

<script>
(() => {

    const API = 'https://haramain-backend.onrender.com';

    let meals = [];
    let orders = [];
    let currentImage = '';
    let editingMeal = false;

    const $ = id => document.getElementById(id);

    function getStored(key) {
        try {
            return JSON.parse(localStorage.getItem(key));
        } catch {
            return null;
        }
    }

    function getToken() {
        return getStored('authToken') || '';
    }

    async function api(path, options = {}) {

        const token = getToken();

        const headers = {
            ...(options.headers || {})
        };

        if (token) {
            headers.Authorization = 'Bearer ' + token;
        }

        if (options.body && !(options.body instanceof FormData)) {
            headers['Content-Type'] = 'application/json';
        }

        const response = await fetch(API + path, {
            ...options,
            headers
        });

        const text = await response.text();

        let data = null;

        try {
            data = text ? JSON.parse(text) : null;
        } catch {
            data = text;
        }

        if (!response.ok) {
            const message = data?.message || data?.error || text;
            throw new Error(message || 'حدث خطأ أثناء الاتصال بالخادم');
        }

        return data;
    }

    function notify(message) {
        if (typeof toast === 'function') {
            toast(message);
        } else {
            alert(message);
        }
    }

    function escapeHTML(value) {
        return String(value ?? '').replace(/[&<>"']/g, char => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;'
        })[char]);
    }

    function getMealId(meal) {
        return meal.mealID ?? meal.mealId ?? meal.id;
    }

    function getStatusText(status) {
        const statuses = {
            pending: 'بانتظار التأكيد',
            confirmed: 'تم التأكيد',
            preparing: 'قيد التجهيز',
            ready: 'جاهز',
            completed: 'مكتمل',
            delivered: 'تم التوصيل',
            cancelled: 'ملغي'
        };

        return statuses[String(status || '').toLowerCase()] || status || 'غير محدد';
    }

    function statusClass(status) {
        const value = String(status || '').toLowerCase();

        if (value === 'confirmed') return 'status-confirmed';
        if (value === 'preparing') return 'status-preparing';
        if (value === 'ready') return 'status-ready';

        return '';
    }

    // تحميل وجبات المطعم

    async function loadMeals() {

        $('mealList').innerHTML =
            '<p class="loading">جاري تحميل الوجبات...</p>';

        try {

            const data = await api('/meals/my-meals');

            meals = Array.isArray(data) ? data : [];

            renderMeals();

            $('totalMeals').textContent = meals.length;

        } catch (error) {

            $('mealList').innerHTML =
                '<p class="empty-message">تعذر تحميل الوجبات: ' +
                escapeHTML(error.message) + '</p>';

        }
    }

    function renderMeals() {

        if (!meals.length) {
            $('mealList').innerHTML =
                '<p class="empty-message">لا توجد وجبات مضافة حتى الآن.</p>';
            return;
        }

        $('mealList').innerHTML = meals.map(meal => {

            const id = getMealId(meal);
            const name = escapeHTML(meal.mealName);
            const description = escapeHTML(meal.description);
            const price = Number(meal.price || 0);
            const quantity = Number(meal.quantity || 0);
            const image = meal.image || '';

            return `
                <article class="meal-card">

                    <img src="${escapeHTML(image)}"
                         alt="${name}"
                         onerror="this.style.display='none'">

                    <div class="meal-info">

                        <h3>${name}</h3>

                        <p>${description}</p>

                        <p>الكمية المتوفرة: ${quantity}</p>

                        <div class="meal-price">
                            ${price.toFixed(2)} ريال
                        </div>

                        <div class="meal-actions">

                            <button class="btn btn-gold"
                                onclick="editMeal(${Number(id)})">
                                تعديل
                            </button>

                            <button class="btn btn-danger"
                                onclick="deleteMeal(${Number(id)})">
                                حذف
                            </button>

                        </div>

                    </div>

                </article>
            `;

        }).join('');
    }

    // فتح نموذج الإضافة

    window.openMealForm = function () {

        editingMeal = false;
        currentImage = '';

        $('mealForm').reset();
        $('mealId').value = '';
        $('modalTitle').textContent = 'إضافة وجبة جديدة';
        $('saveMealBtn').textContent = 'حفظ الوجبة';
        $('imagePreview').style.display = 'none';
        $('imageNote').textContent = 'اختاري صورة للوجبة.';

        $('mealModal').classList.add('show');
    };

    window.closeMealForm = function () {
        $('mealModal').classList.remove('show');
    };

    // معاينة الصورة

    $('mealImage').addEventListener('change', function () {

        const file = this.files[0];

        if (!file) return;

        const allowedTypes = [
            'image/jpeg',
            'image/png',
            'image/webp'
        ];

        if (!allowedTypes.includes(file.type)) {
            notify('نوع الصورة غير مدعوم.');
            this.value = '';
            return;
        }

        if (file.size > 5 * 1024 * 1024) {
            notify('حجم الصورة يجب ألا يتجاوز 5MB.');
            this.value = '';
            return;
        }

        $('imagePreview').src = URL.createObjectURL(file);
        $('imagePreview').style.display = 'block';

    });

    // رفع الصورة إلى Cloudinary

    async function uploadImage(file) {

        const formData = new FormData();
        formData.append('file', file);

        const result = await api('/meals/upload-image', {
            method: 'POST',
            body: formData
        });

        if (!result || !result.imageUrl) {
            throw new Error('لم يرجع الخادم رابط الصورة.');
        }

        return result.imageUrl;
    }

    // حفظ الوجبة

    $('mealForm').addEventListener('submit', async function (event) {

        event.preventDefault();

        const name = $('mealName').value.trim();
        const description = $('mealDescription').value.trim();
        const price = Number($('mealPrice').value);
        const quantity = Number($('mealQuantity').value);
        const file = $('mealImage').files[0];

        if (!name || !description || price <= 0 ||
            !Number.isFinite(price) || quantity < 0 ||
            !Number.isInteger(quantity)) {

            notify('تأكدي من إدخال بيانات الوجبة بشكل صحيح.');
            return;
        }

        if (!editingMeal && !file) {
            notify('اختاري صورة للوجبة.');
            return;
        }

        const button = $('saveMealBtn');
        button.disabled = true;
        button.textContent = 'جاري الحفظ...';

        try {

            let imageUrl = currentImage;

            if (file) {
                imageUrl = await uploadImage(file);
            }

            const mealData = {
                mealName: name,
                description: description,
                price: price,
                quantity: quantity,
                image: imageUrl
            };

            if (editingMeal) {

                const id = $('mealId').value;

                await api('/meals/' + id, {
                    method: 'PUT',
                    body: JSON.stringify(mealData)
                });

                notify('تم تعديل الوجبة بنجاح.');

            } else {

                await api('/meals', {
                    method: 'POST',
                    body: JSON.stringify(mealData)
                });

                notify('تمت إضافة الوجبة بنجاح.');

            }

            closeMealForm();
            await loadMeals();

        } catch (error) {

            notify('تعذر حفظ الوجبة: ' + error.message);

        } finally {

            button.disabled = false;
            button.textContent = editingMeal ? 'حفظ التعديلات' : 'حفظ الوجبة';

        }

    });

    // تعديل وجبة

    window.editMeal = function (id) {

        const meal = meals.find(item =>
            String(getMealId(item)) === String(id)
        );

        if (!meal) return;

        editingMeal = true;

        $('mealId').value = id;
        $('mealName').value = meal.mealName || '';
        $('mealDescription').value = meal.description || '';
        $('mealPrice').value = meal.price || '';
        $('mealQuantity').value = meal.quantity ?? 0;

        currentImage = meal.image || '';

        $('modalTitle').textContent = 'تعديل الوجبة';
        $('saveMealBtn').textContent = 'حفظ التعديلات';
        $('mealImage').value = '';

        if (currentImage) {
            $('imagePreview').src = currentImage;
            $('imagePreview').style.display = 'block';
            $('imageNote').textContent =
                'اتركي الصورة فارغة للاحتفاظ بالصورة الحالية.';
        }

        $('mealModal').classList.add('show');
    };

    // حذف وجبة

    window.deleteMeal = async function (id) {

        if (!confirm('هل أنت متأكدة من حذف هذه الوجبة؟')) {
            return;
        }

        try {

            await api('/meals/' + id, {
                method: 'DELETE'
            });

            notify('تم حذف الوجبة.');

            await loadMeals();

        } catch (error) {

            notify('تعذر حذف الوجبة: ' + error.message);

        }
    };

    // تحميل طلبات المطعم

    window.loadOrders = async function () {

        $('ordersList').innerHTML = `
            <tr>
                <td colspan="5" class="loading">جاري تحميل الطلبات...</td>
            </tr>
        `;

        try {

            const data = await api('/restaurant/orders');

            orders = Array.isArray(data) ? data : [];

            renderOrders();

            $('newOrders').textContent =
                orders.filter(order =>
                    ['pending', 'confirmed'].includes(
                        String(order.status || '').toLowerCase()
                    )
                ).length;

            $('readyOrders').textContent =
                orders.filter(order =>
                    String(order.status || '').toLowerCase() === 'ready'
                ).length;

        } catch (error) {

            $('ordersList').innerHTML = `
                <tr>
                    <td colspan="5" class="empty-message">
                        تعذر تحميل الطلبات: ${escapeHTML(error.message)}
                    </td>
                </tr>
            `;

        }
    };

    function renderOrders() {

        if (!orders.length) {
            $('ordersList').innerHTML = `
                <tr>
                    <td colspan="5" class="empty-message">
                        لا توجد طلبات حتى الآن.
                    </td>
                </tr>
            `;
            return;
        }

        $('ordersList').innerHTML = orders.map(order => {

            const id = order.requestId;
            const status = String(order.status || '').toLowerCase();

            let action = '';

            if (status === 'pending') {
                action = `
                    <button class="btn btn-green"
                        onclick="updateOrderStatus(${Number(id)}, 'confirmed')">
                        تأكيد الطلب
                    </button>
                `;
            } else if (status === 'confirmed') {
                action = `
                    <button class="btn btn-gold"
                        onclick="updateOrderStatus(${Number(id)}, 'preparing')">
                        بدء التجهيز
                    </button>
                `;
            } else if (status === 'preparing') {
                action = `
                    <button class="btn btn-green"
                        onclick="updateOrderStatus(${Number(id)}, 'ready')">
                        الطلب جاهز
                    </button>
                `;
            } else if (status === 'ready') {

    if (order.deliveryMethod === 'courier' && order.courierId) {

        action = `
            <span class="status status-confirmed">
                تم إسناده للمندوب #${Number(order.courierId)}
            </span>
        `;

    } else {

        action = `
            <button class="btn btn-gold"
                onclick="assignCourier(${Number(id)})">
                إسناد لمندوب
            </button>
        `;

    }

} else {
    action = '—';
}

            return `
                <tr>
                    <td>#${escapeHTML(id)}</td>
                    <td>${escapeHTML(order.userId)}</td>
                    <td>${escapeHTML(order.requestDate)}</td>
                    <td>
                        <span class="status ${statusClass(status)}">
                            ${escapeHTML(getStatusText(status))}
                        </span>
                    </td>
                    <td>${action}</td>
                </tr>
            `;

        }).join('');
    }

    // إسناد الطلب إلى مندوب
window.assignCourier = async function (id) {

    try {

        // جلب قائمة المندوبين النشطين
        const couriers = await api('/restaurant/couriers');

        if (!Array.isArray(couriers) || couriers.length === 0) {
            notify('لا يوجد مندوبون نشطون حاليًا.');
            return;
        }

        // تجهيز قائمة الاختيار
        const choices = couriers.map((courier, index) =>
            `${index + 1}- ${courier.fullName} (رقم المستخدم: ${courier.userId})`
        ).join('\n');

        const selected = prompt(
            'اختاري رقم المندوب:\n\n' + choices
        );

        if (selected === null) return;

        const index = Number(selected) - 1;

        if (!Number.isInteger(index) ||
            index < 0 ||
            index >= couriers.length) {

            notify('اختيار غير صحيح.');
            return;
        }

        const courier = couriers[index];

        if (!confirm(`هل تريدين إسناد الطلب رقم ${id} إلى ${courier.fullName}؟`)) {
            return;
        }

        // إرسال الإسناد إلى الباكند
        await api('/restaurant/orders/' + id + '/assign', {
            method: 'PUT',
            body: JSON.stringify({
                deliveryMethod: 'courier',
                courierId: courier.userId
            })
        });

        notify('تم إسناد الطلب إلى المندوب بنجاح.');

        await loadOrders();

    } catch (error) {

        notify('تعذر إسناد الطلب: ' + error.message);

    }
};

    // تحديث حالة الطلب

    window.updateOrderStatus = async function (id, status) {

        const messages = {
            confirmed: 'تأكيد هذا الطلب؟',
            preparing: 'بدء تجهيز هذا الطلب؟',
            ready: 'تأكيد أن الطلب أصبح جاهزاً؟'
        };

        if (!confirm(messages[status] || 'تحديث حالة الطلب؟')) {
            return;
        }

        try {

            await api('/restaurant/orders/' + id + '/status', {
                method: 'PUT',
                body: JSON.stringify({ status: status })
            });

            notify('تم تحديث حالة الطلب.');

            await loadOrders();

        } catch (error) {

            notify('تعذر تحديث الطلب: ' + error.message);

        }
    };

    // بدء تحميل بيانات الصفحة

    loadMeals();
    loadOrders();

})();
</script>
