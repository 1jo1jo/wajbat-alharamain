<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>إنشاء حساب جديد | وجبة الحرمين</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="register" data-nav="0">
<div id="app">
<section class="view" id="v-login">
  <button class="home" onclick="go('home')"><svg class="i "><use href="#home"/></svg></button>
  <div class="lg"><img src="images/logo.png" alt="" onerror="this.remove()"></div>
  <h1 class="rt">إنشاء حساب جديد</h1><p class="rs">انضم إلينا لخدمة ضيوف الرحمن</p>
  <form class="lf" onsubmit="register();return false">
    <div class="fld"><svg class="i r"><use href="#user"/></svg><input class="inp" id="rn" type="text" placeholder="الاسم الكامل" autocomplete="name"></div>
    <div class="fld"><svg class="i r"><use href="#mail"/></svg><input class="inp" id="re" type="email" placeholder="البريد الإلكتروني" autocomplete="email"></div>
    <div class="fld"><svg class="i r"><use href="#phone"/></svg><input class="inp" id="rp" type="tel" placeholder="رقم الجوال" autocomplete="tel" inputmode="numeric" maxlength="10"></div>
    <div class="fld"><svg class="i r"><use href="#lock"/></svg><button type="button" class="eye" onclick="toggleEye(this)"><svg class="i "><use href="#eye-off"/></svg></button><input class="inp" id="r1" type="password" placeholder="كلمة المرور" autocomplete="new-password"></div>
    <div class="fld"><svg class="i r"><use href="#lock"/></svg><button type="button" class="eye" onclick="toggleEye(this)"><svg class="i "><use href="#eye-off"/></svg></button><input class="inp" id="r2" type="password" placeholder="تأكيد كلمة المرور" autocomplete="new-password"></div>
    <label class="terms"><input type="checkbox" id="terms"><span>أوافق على الشروط والأحكام</span></label>
    <button class="btn-green" type="submit">إنشاء الحساب</button>
    <p class="new">لديك حساب؟ <b onclick="go('login')">تسجيل الدخول</b></p>
  </form>
</section>
</div>
<script src="js/script.js"></script>
</body>
</html>
