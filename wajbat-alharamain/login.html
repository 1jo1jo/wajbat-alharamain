<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تسجيل الدخول | وجبة الحرمين</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="login" data-nav="0">
<div id="app">
<section class="view" id="v-login">
  <button class="home" onclick="go('home')"><svg class="i "><use href="#home"/></svg></button>
  <div class="lg"><img src="images/logo.png" alt="" onerror="this.remove()"></div>
  <h1>وجبة الحرمين</h1><p class="s">— معك في كل خطوة —</p>
  <h2>مرحباً بك</h2><p>تسجيل الدخول للمتابعة</p>
 <form class="lf" onsubmit="login();return false">

    <div class="fld">
        <svg class="i r"><use href="#mail"/></svg>
        <input class="inp" id="em" type="text"
        placeholder="البريد الإلكتروني أو اسم المستخدم"
        autocomplete="username">
    </div>

    <div class="fld">
        <svg class="i r"><use href="#lock"/></svg>
        <button type="button" class="eye" onclick="toggleEye(this)">
            <svg class="i"><use href="#eye-off"/></svg>
        </button>
        <input class="inp" id="pw" type="password"
        placeholder="كلمة المرور"
        autocomplete="current-password">
    </div>

    <button class="btn-green" type="submit">
        <svg class="i"><use href="#arrow-l"/></svg>
        تسجيل الدخول
    </button>

    <a href="forgot.html">نسيت كلمة المرور؟</a>

    <button type="button" class="btn-green alt"
    onclick="toast('تسجيل الدخول عبر Apple غير مفعّل في النسخة التجريبية')">
        تسجيل الدخول باستخدام Apple
        <svg class="i"><use href="#apple"/></svg>
    </button>

    <button type="button" class="btn-green alt"
    onclick="toast('تسجيل الدخول عبر Google غير مفعّل في النسخة التجريبية')">
        تسجيل الدخول باستخدام Google
        <b style="font-size:20px;margin:0 6px">G</b>
    </button>

    <p class="new">ليس لديك حساب؟
        <b onclick="go('register')">إنشاء حساب جديد</b>
    </p>

</form>
</section>
</div>
<script src="js/script.js"></script>
</body>
</html>
